# =============================================================================
# ALL Detection Project — Central Configuration
# All modules import this file via src/utils/config.py
# =============================================================================

# --- Reproducibility ---
seed: 42

# --- Paths ---
paths:
  data_raw:       data/raw
  data_processed: data/processed
  experiments:    experiments
  weights:        experiments/weights
  logs:           experiments/logs
  figures:        experiments/figures
  tables:         experiments/tables

# --- Dataset ---
dataset:
  name: C_NMC_2019
  kaggle_id: "andrewmvd/leukemia-classification"
  image_size: 224          # Transfer learning modelleri için (AlexNet/VGG/ResNet girişi)
  val_split: 0.15          # Test çıkarıldıktan sonraki verinin val oranı
  test_split: 0.15         # Tüm verinin test oranı (hasta-bazlı ayrılır)
  # Hasta ID parse kuralı: dosya adı stem'inden son 2 alt çizgi bölümü atılır.
  # Örn: UID_H1_1_3 → UID_H1  |  Uygulayan: src/data/explore.py::parse_patient_id()
  patient_id_field: "filename_prefix"

# --- Training ---
training:
  batch_size: 32
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine        # options: step | cosine | none
  early_stopping_patience: 7
  num_workers: 4           # DataLoader workers; set to 0 on Windows if multiprocessing fails

# --- Models to run (toggle individual models on/off) ---
models:
  baseline:     true   # Otsu segmentation + handcrafted features + Logistic Regression
  classical_ml: true   # HOG/LBP + SVM
  alexnet:      true   # Transfer learning
  vgg16:        true   # Transfer learning
  resnet50:     true   # Transfer learning

# --- Faz 2: Eğitim hiperparametreleri (tüm modeller için kaynak of truth) ---
phase2:
  seed: 42
  image_size: 224
  batch_size: 32
  num_workers: 2
  epochs: 25
  early_stopping_patience: 5
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0001
  augmentation: true
  pretrained: true
  freeze_backbone: false
  use_amp: true
  use_cached_features: true
  svm_kernel: rbf               # rbf (varsayılan) | linear (7000+ örnek için hız)
  models: [baseline, classical_ml, alexnet, vgg16, resnet50]
  resnet_variant: resnet50      # resnet18 de seçilebilir (T4 zorlanırsa)
  vgg_variant: vgg16            # vgg16_bn de seçilebilir (daha stabil BN)
  # Not: VGG16/ResNet50 224px + bs=32 + AMP ile T4'e sığmalı;
  #      OOM alınırsa batch_size: 16 yapın.

# --- Augmentation ---
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip:   false
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast:   0.2
    saturation: 0.1
  normalize:
    mean: [0.485, 0.456, 0.406]   # ImageNet stats (used for transfer-learning models)
    std:  [0.229, 0.224, 0.225]
