# =============================================================================
# ALL Detection Project — Central Configuration
# All modules import this file via src/utils/config.py
# =============================================================================

# --- Reproducibility ---
seed: 42

# --- Paths ---
paths:
  data_raw:       data/raw
  data_processed: data/processed
  experiments:    experiments
  weights:        experiments/weights
  logs:           experiments/logs
  figures:        experiments/figures
  tables:         experiments/tables

# --- Dataset ---
dataset:
  name: C_NMC_2019
  kaggle_id: "andrewmvd/leukemia-classification"   # Kaggle dataset slug (verify before use)
  image_size: 224          # Resize target (H=W), pixels
  val_split: 0.15          # Fraction of train set used for validation
  test_split: 0.15         # Fraction held out as test (patient-level split)
  patient_id_field: null   # Column/folder name that identifies the patient; set in Faz 1

# --- Training ---
training:
  batch_size: 32
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine        # options: step | cosine | none
  early_stopping_patience: 7
  num_workers: 4           # DataLoader workers; set to 0 on Windows if multiprocessing fails

# --- Models to run (toggle individual models on/off) ---
models:
  baseline:     true   # Otsu segmentation + handcrafted features + Logistic Regression
  classical_ml: true   # HOG/LBP + SVM
  alexnet:      true   # Transfer learning
  vgg16:        true   # Transfer learning
  resnet50:     true   # Transfer learning

# --- Augmentation ---
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip:   false
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast:   0.2
    saturation: 0.1
  normalize:
    mean: [0.485, 0.456, 0.406]   # ImageNet stats (used for transfer-learning models)
    std:  [0.229, 0.224, 0.225]
